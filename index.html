<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schoology Platformer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%230673b7'/%3E%3Ctext x='9' y='24' fill='white' font-size='26'%3Es%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Schoology home"><span class="brand-mark">s</span>schoology</a>
    <nav aria-label="Schoology navigation">
      <button id="courses-nav">COURSES <span>▾</span></button><button id="groups-nav">GROUPS <span>▾</span></button><button id="resources-nav">RESOURCES <span>▾</span></button><button data-level="2">GRADES</button>
    </nav>
    <div class="header-tools" id="header-tools"></div>
    <button class="user-menu" id="user-menu"><span class="avatar">JD</span> Jamie Davis <span>⌄</span></button>
    <div id="nav-popover" hidden></div>
  </header>
  <div id="viewport" tabindex="0" aria-label="Schoology Platformer. A and D to move, Space to jump, Escape to pause.">
    <div id="scene">
      <div id="world"></div>
      <div id="player"><svg viewBox="0 0 40 48" aria-hidden="true"><path class="foot left" d="M12 37v7H6"/><path class="foot right" d="M25 37v7h6"/><path d="M6 3L33 24l-13 2-6 12z" fill="white" stroke="#203952" stroke-width="2.6" stroke-linejoin="round"/><ellipse cx="14" cy="20" rx="2" ry="3" fill="#203952"/><ellipse cx="22" cy="20" rx="2" ry="3" fill="#203952"/></svg><span class="you-label">YOU</span></div>
      <div id="particles"></div>
    </div>
    <div id="overlay"></div>
  </div>
  <footer class="game-bar">
    <div class="game-label"><svg class="cursor-mini" viewBox="0 0 20 24" aria-hidden="true"><path d="M3 2v18l5-5 4 7 3-2-4-7h7z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><b>Schoology Platformer</b><span id="level-title">Courses</span><span id="difficulty">Easy</span></div>
    <div class="game-stats"><span id="key-stat"></span><span id="fall-stat"></span></div>
    <div class="game-controls"><span><kbd>A</kbd><kbd>D</kbd> Move</span><span><kbd>Space</kbd> Jump</span><button id="help">Help</button><button id="pause"><svg class="pause-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 2v8M9 2v8" stroke="currentColor" stroke-width="2"/></svg> <span>Pause</span> <kbd>Esc</kbd></button></div>
  </footer>
  <div class="status-line"><span id="hint">Jump on the actual page elements. Reach Next Page to continue.</span><span>Fictional school & student · Unofficial game · No login required</span></div>
  <script type="module" src="game.js"></script>
</body>
</html>
